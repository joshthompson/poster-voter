<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff7ee" />
    <link rel="icon" href="%sveltekit.assets%/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap"
      rel="stylesheet"
    />
    <title>Poster Voter</title>
    <meta name="description" content="Two posters, one vote. Pick your favourite and see if the crowd agrees." />

    <!-- Link previews. Crawlers need absolute URLs; update these if the site moves. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Poster Voter" />
    <meta property="og:title" content="Poster Voter!" />
    <meta property="og:description" content="Two posters, one vote. Pick your favourite and see if the crowd agrees." />
    <meta property="og:url" content="https://joshthompson.github.io/poster-voter/" />
    <meta property="og:image" content="https://joshthompson.github.io/poster-voter/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="Poster Voter! in pixel lettering on a polka-dot background" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Poster Voter!" />
    <meta name="twitter:description" content="Two posters, one vote. Pick your favourite and see if the crowd agrees." />
    <meta name="twitter:image" content="https://joshthompson.github.io/poster-voter/og-image.png" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
